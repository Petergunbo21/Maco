
      - name: Build APK with detailed errors
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug \
            --refresh-dependencies \
            --stacktrace \
            --info 2>&1 | tee build-log.txt
          
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_STATUS"
          exit $BUILD_STATUS

      - name: Save build error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROOK-BUILD-LOG
          path: ${{ env.PROJECT_DIR }}/build-log.txt
          if-no-files-found: ignore
