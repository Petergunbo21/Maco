
name: Extract ROOK Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'ROOK_Fisch_Macro_Advisor_Android_Source.zip'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract ROOK ZIP
        run: |
          mkdir -p ROOK_AI
          unzip -o ROOK_Fisch_Macro_Advisor_Android_Source.zip -d ROOK_AI

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: ROOK_AI_Extracted
          path: ROOK_AI/
